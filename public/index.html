<!doctype html>
<html lang="zh-CN" class="international">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>词间日和 · Words in Bloom</title>
    <meta name="description" content="让英语成为日常。通过词集、英文点读、语境例句与记忆测试，建立自己的长期学习节奏。" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="read-aloud.css" />
    <style>
      /* ===== 主题变量：集中控制全站色彩、边框与阴影 ===== */
      :root {
        --bg-main: #f2efea;
        --bg-secondary: #ece8e5;
        --card-bg: rgba(251, 249, 246, 0.88);
        --card-hover: rgba(255, 254, 251, 0.97);
        --pink: #b56f82;
        --pink-light: #ddc8cd;
        --pink-soft: #eee6e5;
        --peach: #d8b495;
        --purple: #b9abc8;
        --blue: #bdd5e3;
        --green: #9caf94;
        --gold: #b38a5b;
        --gold-soft: #eee1d0;
        --plum: #6f4450;
        --text: #3f3739;
        --muted: #75696c;
        --light: #94878a;
        --border: rgba(100, 84, 88, 0.22);
        --sakura-glow-x: 92%;
        --sakura-glow-y: 18%;
        --shadow:
          0 15px 34px rgba(58, 48, 51, 0.1),
          0 2px 5px rgba(58, 48, 51, 0.06),
          inset 0 1px 0 rgba(255, 255, 255, 0.82);
      }
      * {
        box-sizing: border-box;
      }
      /* ===== 页面基础与低干扰花影背景 ===== */
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        color: var(--text);
        font-family: "Noto Serif SC", "Microsoft YaHei", serif;
        background:
          radial-gradient(
            circle at var(--sakura-glow-x) var(--sakura-glow-y),
            rgba(213, 166, 177, 0.16),
            transparent 27%
          ),
          radial-gradient(
            circle at 7% 91%,
            rgba(201, 215, 220, 0.2),
            transparent 24%
          ),
          linear-gradient(132deg, #fdfbf8 0%, #f8f1f1 50%, #f6f1eb 100%);
        background-attachment: fixed, fixed, fixed;
        background-color: #fdfbf8;
        min-height: 100vh;
        overflow-x: hidden;
      }
      body:before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.26;
        background-image: radial-gradient(
          rgba(155, 118, 126, 0.12) 0.7px,
          transparent 0.7px
        );
        background-size: 7px 7px;
      }
      .garden-background-art {
        position: fixed;
        z-index: 0;
        left: 0;
        bottom: 0;
        width: 100vw;
        height: 33.333vw;
        min-height: 300px;
        object-fit: cover;
        object-position: center bottom;
        pointer-events: none;
        opacity: 0.6;
        filter: saturate(56%) contrast(94%) brightness(1.025);
        -webkit-mask-image: linear-gradient(
          to bottom,
          transparent 0%,
          rgba(0, 0, 0, 0.18) 22%,
          rgba(0, 0, 0, 0.72) 47%,
          #000 68%
        );
        mask-image: linear-gradient(
          to bottom,
          transparent 0%,
          rgba(0, 0, 0, 0.18) 22%,
          rgba(0, 0, 0, 0.72) 47%,
          #000 68%
        );
      }
      .glow {
        position: fixed;
        border-radius: 50%;
        filter: blur(24px);
        opacity: 0.14;
        pointer-events: none;
        animation: drift 16s ease-in-out infinite alternate;
      }
      .g1 {
        display: block;
        width: 36vw;
        height: 36vw;
        background: #f8cbd4;
        top: -5vw;
        right: -8vw;
      }
      .g2 {
        width: 30vw;
        height: 30vw;
        background: #dce8ed;
        bottom: -9vw;
        left: -8vw;
        animation-delay: -7s;
      }
      .petal {
        position: fixed;
        color: #e6a9b7;
        opacity: 0.42;
        pointer-events: none;
        animation: fall 15s linear infinite;
        filter: drop-shadow(0 3px 7px rgba(190, 111, 132, 0.16));
      }
      .p1 {
        left: 8%;
        top: -5%;
        animation-delay: -2s;
      }
      .p2 {
        left: 78%;
        top: -8%;
        animation-delay: -8s;
      }
      .p3 {
        left: 48%;
        top: -12%;
        animation-delay: -12s;
      }
      .p4 {
        left: 18%;
        top: -10%;
        font-size: 12px;
        animation-delay: -5s;
        animation-duration: 18s;
      }
      .p5 {
        left: 31%;
        top: -7%;
        font-size: 17px;
        animation-delay: -14s;
        animation-duration: 21s;
      }
      .p6 {
        left: 59%;
        top: -14%;
        font-size: 11px;
        animation-delay: -3s;
        animation-duration: 17s;
      }
      .p7 {
        left: 68%;
        top: -9%;
        font-size: 15px;
        animation-delay: -17s;
        animation-duration: 23s;
      }
      .p8 {
        left: 88%;
        top: -16%;
        font-size: 13px;
        animation-delay: -10s;
        animation-duration: 19s;
      }
      .p9 {
        left: 3%;
        top: -13%;
        font-size: 10px;
        animation-delay: -20s;
        animation-duration: 24s;
      }
      .p10 {
        left: 40%;
        top: -18%;
        font-size: 14px;
        animation-delay: -7s;
        animation-duration: 20s;
      }
      .p11 {
        left: 95%;
        top: -11%;
        font-size: 16px;
        animation-delay: -1s;
        animation-duration: 22s;
      }
      @keyframes drift {
        to {
          transform: translate(6vw, 4vh) scale(1.08);
        }
      }
      @keyframes fall {
        to {
          transform: translate(10vw, 110vh) rotate(420deg);
        }
      }
      body.no-motion *,
      body.no-motion *::before,
      body.no-motion *::after {
        animation-play-state: paused !important;
      }
      /* 关闭花影后页面切换直接显示最终状态，避免入场动画被冻结在 opacity:0。 */
      body.no-motion .page {
        animation: none !important;
        opacity: 1 !important;
        visibility: visible !important;
        transform: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        body:not(.motion-enabled) *,
        body:not(.motion-enabled) *::before,
        body:not(.motion-enabled) *::after {
          animation-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        border: 0;
        cursor: pointer;
      }
      .glass {
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.78), rgba(246, 243, 239, 0.72)),
          var(--card-bg);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        backdrop-filter: blur(11px) saturate(108%);
        -webkit-backdrop-filter: blur(11px) saturate(108%);
      }
      /* 参考纯 CSS 液态玻璃的多层内描边与对角高光，但降低模糊和反差以保证阅读清晰。 */
      .topbar,
      .dashboard,
      .filters,
      .journal-card,
      .study-card,
      .face,
      .quiz-card,
      .quiz-setup,
      .result-card {
        isolation: isolate;
        overflow: hidden;
      }
      .dashboard,
      .filters,
      .study-card,
      .quiz-card,
      .quiz-setup,
      .result-card {
        position: relative;
      }
      .topbar::before,
      .dashboard::before,
      .filters::before,
      .journal-card::before,
      .study-card::before,
      .quiz-card::before,
      .quiz-setup::before,
      .result-card::before {
        content: "";
        position: absolute;
        z-index: 0;
        inset: 1px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: inherit;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.46) 0%,
          rgba(255, 255, 255, 0.08) 22%,
          transparent 46%,
          rgba(78, 64, 68, 0.035) 76%,
          rgba(255, 255, 255, 0.22) 100%
        );
        box-shadow:
          inset 1px -1px 0 rgba(255, 255, 255, 0.48),
          inset -1px 1px 0 rgba(73, 60, 64, 0.055);
        pointer-events: none;
      }
      .topbar::after,
      .dashboard::after,
      .filters::after,
      .journal-card::after,
      .study-card::after,
      .quiz-card::after,
      .quiz-setup::after,
      .result-card::after {
        content: "";
        position: absolute;
        z-index: 0;
        top: -55%;
        left: -18%;
        width: 48%;
        height: 155%;
        transform: rotate(17deg);
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        opacity: 0.48;
        pointer-events: none;
      }
      .topbar > *,
      .dashboard > *,
      .filters > *,
      .journal-card > *,
      .study-card > *,
      .face > *,
      .quiz-card > *,
      .quiz-setup > *,
      .result-card > * {
        position: relative;
        z-index: 1;
      }
      /* ===== 桌面顶部导航与通用按钮 ===== */
      .topbar {
        position: fixed;
        z-index: 20;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        width: min(1180px, calc(100% - 28px));
        height: 80px;
        border-radius: 27px;
        display: flex;
        align-items: center;
        padding: 8px 13px 8px 18px;
        gap: 10px;
        border-color: rgba(166, 130, 138, 0.18);
        box-shadow:
          0 14px 32px rgba(56, 46, 49, 0.11),
          0 2px 5px rgba(56, 46, 49, 0.05),
          inset 0 1px 0 rgba(255, 255, 255, 0.88);
      }
      .brand {
        font-weight: 800;
        white-space: nowrap;
        margin-right: auto;
      }
      .brand small {
        display: block;
        font: italic 11px Georgia;
        color: var(--muted);
        letter-spacing: 0.12em;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .nav button,
      .icon-btn {
        background: transparent;
        border-radius: 16px;
        white-space: nowrap;
      }
      .nav button {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-width: 70px;
        height: 62px;
        padding: 7px 10px;
        font-size: 12px;
        line-height: 1.1;
        transition: 0.3s;
      }
      .nav button span {
        display: block;
        font-size: 19px;
        line-height: 1;
        color: var(--muted);
        transition: 0.3s;
      }
      .nav button.active span,
      .nav button:hover span {
        color: #9f6673;
        transform: translateY(-1px);
      }
      .icon-btn {
        padding: 10px 11px;
      }
      .motion-toggle {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-width: 146px;
        height: 46px;
        padding: 6px 9px 6px 8px;
        overflow: hidden;
        border: 1px solid rgba(168, 132, 140, 0.2);
        border-radius: 999px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.72), rgba(241, 226, 230, 0.62));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          0 8px 24px rgba(102, 69, 76, 0.09);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease,
          border-color 0.3s ease;
      }
      .motion-toggle::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 -55%;
        width: 42%;
        transform: skewX(-18deg);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
        transition: left 0.55s ease;
      }
      .motion-toggle:hover {
        transform: translateY(-1px);
        border-color: rgba(179, 138, 91, 0.38);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.96),
          0 13px 30px rgba(102, 69, 76, 0.14);
      }
      .motion-toggle:hover::before {
        left: 118%;
      }
      .motion-bloom {
        display: grid;
        place-items: center;
        width: 25px;
        height: 25px;
        flex: 0 0 auto;
        border: 1px solid rgba(179, 138, 91, 0.28);
        border-radius: 50%;
        color: #a66073;
        background: rgba(255, 253, 249, 0.76);
        box-shadow: inset 0 1px 0 #fff;
        font-size: 14px;
      }
      .motion-label {
        color: #65575a;
        font-size: 12px;
        letter-spacing: 0.08em;
      }
      .motion-toggle .switch-track {
        position: relative;
        width: 42px;
        height: 23px;
        flex: 0 0 auto;
        border-radius: 999px;
        border: 1px solid rgba(99, 88, 91, 0.16);
        background: linear-gradient(135deg, #b8afb0, #8f8587);
        box-shadow:
          inset 0 2px 5px rgba(64, 56, 58, 0.2),
          0 1px 0 rgba(255, 255, 255, 0.72);
        transition: 0.3s;
      }
      .motion-toggle .switch-track::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: 1px solid rgba(171, 139, 103, 0.2);
        background: radial-gradient(circle at 35% 28%, #fff, #f5eee4 72%);
        box-shadow:
          0 3px 8px rgba(61, 43, 47, 0.28),
          inset 0 1px 0 #fff;
        transition: 0.3s;
      }
      .motion-toggle.on .switch-track {
        border-color: rgba(117, 75, 85, 0.2);
        background: linear-gradient(135deg, #b47a87, #8f5d69);
        box-shadow:
          inset 0 2px 5px rgba(76, 48, 55, 0.25),
          0 0 0 3px rgba(180, 122, 135, 0.09),
          0 1px 0 rgba(255, 255, 255, 0.72);
      }
      .motion-toggle.on .switch-track::after {
        transform: translateX(19px);
      }
      .motion-toggle .motion-state {
        min-width: 13px;
        color: #756a6d;
        font-style: normal;
        font-size: 12px;
      }
      .motion-toggle.on .motion-state {
        color: #915666;
      }
      .motion-toggle:not(.on) {
        border-color: rgba(126, 115, 118, 0.22);
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.76),
          rgba(232, 228, 228, 0.68)
        );
      }
      .motion-toggle:not(.on) .motion-bloom {
        color: #887d80;
        border-color: rgba(126, 115, 118, 0.24);
        background: rgba(247, 244, 242, 0.84);
      }
      .motion-toggle:not(.on) .motion-label {
        color: #756a6d;
      }
      .motion-toggle.on {
        border-color: rgba(180, 122, 135, 0.3);
        background: linear-gradient(
          135deg,
          rgba(255, 253, 253, 0.8),
          rgba(244, 224, 230, 0.74)
        );
      }
      .motion-toggle.on .motion-bloom {
        color: #a5536a;
        border-color: rgba(180, 122, 135, 0.34);
        background: rgba(255, 249, 250, 0.9);
      }
      .motion-toggle.on .motion-label {
        color: #81525e;
      }
      .nav button.active,
      .nav button:hover {
        background: var(--pink-soft);
        color: #9f6673;
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 4px;
        padding-left: 7px;
        border-left: 1px solid rgba(199, 161, 170, 0.18);
      }
      /* ===== 后端同步状态：位于最外层页面容器底部，不覆盖学习内容 ===== */
      .app-shell {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .app-status-row {
        width: min(1160px, calc(100% - 32px));
        margin: 0 auto;
        padding: 0 0 24px;
        display: flex;
        justify-content: flex-end;
      }
      .sync-status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        max-width: min(420px, calc(100vw - 36px));
        padding: 8px 12px;
        border: 1px solid rgba(213, 171, 181, 0.32);
        border-radius: 999px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.84);
        box-shadow: 0 8px 24px rgba(160, 115, 126, 0.12);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        font-size: 12px;
        line-height: 1.3;
        transition: 0.25s;
      }
      .sync-status::before {
        content: "";
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #b9aaad;
        box-shadow: 0 0 0 3px rgba(185, 170, 173, 0.14);
      }
      .sync-status[data-state="connecting"]::before,
      .sync-status[data-state="syncing"]::before {
        background: #d0a469;
        box-shadow: 0 0 0 3px rgba(208, 164, 105, 0.16);
      }
      .sync-status[data-state="connected"]::before {
        background: #7ca173;
        box-shadow: 0 0 0 3px rgba(124, 161, 115, 0.16);
      }
      .sync-status[data-state="error"]::before {
        background: #c87986;
        box-shadow: 0 0 0 3px rgba(200, 121, 134, 0.16);
      }
      .pill {
        padding: 11px 19px;
        border-radius: 999px;
        border: 1px solid rgba(154, 118, 126, 0.16);
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.9), rgba(248, 240, 239, 0.76));
        box-shadow:
          0 10px 26px rgba(91, 61, 68, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.92);
        transition: 0.3s ease;
      }
      .pill:hover {
        transform: translateY(-2px);
        border-color: rgba(179, 138, 91, 0.34);
        background: linear-gradient(145deg, #fff, #f7ede9);
        box-shadow:
          0 15px 34px rgba(91, 61, 68, 0.13),
          inset 0 1px 0 #fff;
      }
      .primary {
        border-color: rgba(111, 68, 80, 0.12);
        background: linear-gradient(135deg, #c98696, #9e6574 70%, #8b5965);
        color: white;
        box-shadow:
          0 13px 30px rgba(126, 67, 84, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.25);
      }
      .pill.primary:hover,
      .pill.primary:focus-visible {
        background: linear-gradient(135deg, #d391a0, #a76878 68%, #895661);
        color: #fff;
        box-shadow: 0 13px 30px rgba(177, 91, 113, 0.28);
      }
      .pill.primary:active {
        background: linear-gradient(135deg, #d48698, #bf7589);
        color: #fff;
        transform: translateY(0);
      }
      .pill.primary:disabled {
        background: linear-gradient(135deg, #e4adba, #d79cac);
        color: #fff;
        opacity: 0.72;
      }
      .danger {
        color: #a66d78;
        background: #f9e8eb;
      }
      /* ===== 页面容器、首页信息面板与词集轮播 ===== */
      .main {
        position: relative;
        z-index: 1;
        flex: 1;
        width: min(1160px, calc(100% - 32px));
        margin: auto;
        padding: 128px 0 54px;
      }
      .page {
        display: none;
        animation: appear 0.42s ease;
      }
      .page.active {
        display: block;
      }
      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      .hero {
        text-align: center;
        padding: 34px 0 22px;
      }
      .eyebrow {
        color: #b17986;
        letter-spacing: 0.26em;
        font: italic 14px Georgia;
      }
      .hero h1 {
        font-size: clamp(42px, 7vw, 76px);
        margin: 8px 0 4px;
        letter-spacing: 0.08em;
      }
      .hero .jp {
        color: var(--light);
        letter-spacing: 0.38em;
      }
      .subtitle {
        color: #7e686d;
        font:
          italic 17px/1.8 "Yu Mincho", "Hiragino Mincho ProN", Georgia,
          "Times New Roman", serif;
        letter-spacing: 0.09em;
        text-wrap: balance;
      }
      .date {
        display: inline-block;
        margin-top: 8px;
        padding: 7px 14px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.55);
        font-size: 13px;
      }
      .dashboard {
        margin: 28px auto;
        max-width: 900px;
        border-radius: 38px;
        padding: 30px;
        display: grid;
        grid-template-columns: 210px 1fr;
        gap: 30px;
        align-items: center;
        border-color: rgba(165, 127, 136, 0.17);
        box-shadow:
          0 18px 44px rgba(56, 46, 49, 0.1),
          0 2px 5px rgba(56, 46, 49, 0.05),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }
      .ring {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        position: relative;
        background: conic-gradient(
          var(--pink) var(--progress),
          rgba(236, 218, 221, 0.48) 0
        );
      }
      .ring:after {
        content: "";
        position: absolute;
        inset: 13px;
        border-radius: 50%;
        background: #fffafa;
      }
      .ring span {
        z-index: 1;
        font: 700 34px Georgia;
      }
      .ring small {
        display: block;
        font: 12px sans-serif;
        color: var(--muted);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .stat {
        padding: 14px 15px;
        border: 1px solid rgba(162, 126, 134, 0.12);
        border-radius: 17px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.58), rgba(246, 237, 235, 0.4));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.78);
      }
      .stat b {
        display: block;
        font: 700 25px Georgia;
      }
      .stat small {
        color: var(--muted);
      }
      .actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .recent {
        text-align: center;
        color: #8b767b;
        font: italic 13px/1.7 Georgia, "Times New Roman", serif;
        letter-spacing: 0.055em;
        margin-top: 16px;
      }
      .home-grid {
        max-width: 900px;
        margin: 18px auto 0;
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 18px;
      }
      .journal-card {
        border-radius: 31px;
        padding: 24px;
        position: relative;
        overflow: hidden;
        border-color: rgba(164, 126, 135, 0.17);
      }
      .journal-card:after {
        content: "❀";
        position: absolute;
        right: 18px;
        top: 10px;
        font-size: 62px;
        color: rgba(225, 164, 178, 0.13);
        transform: rotate(12deg);
      }
      .journal-label {
        font: italic 12px Georgia;
        color: #b37c89;
        letter-spacing: 0.18em;
      }
      .journal-card h3 {
        font-size: 24px;
        margin: 8px 0;
      }
      .journal-card p {
        color: var(--muted);
        line-height: 1.7;
      }
      .word-preview {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin: 15px 0;
      }
      .word-preview span {
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(237, 232, 225, 0.9);
        font: 14px Georgia;
      }
      .path-list {
        display: grid;
        gap: 10px;
        margin-top: 14px;
      }
      .path-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.46);
      }
      .path-item i {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--pink-soft);
        font-style: normal;
      }
      .path-item b {
        display: block;
      }
      .path-item small {
        color: var(--muted);
        font: italic 12px/1.55 Georgia, "Times New Roman", serif;
        letter-spacing: 0.025em;
      }
      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }
      .section-head h2 {
        font-size: 32px;
        margin: 0;
      }
      .section-head p {
        color: #89767b;
        margin: 5px 0;
        font:
          italic 14px/1.75 "Yu Mincho", "Hiragino Mincho ProN", Georgia,
          "Times New Roman", serif;
        letter-spacing: 0.045em;
        text-wrap: balance;
      }
      /* ===== 词库筛选、单词卡片与收藏状态 ===== */
      .filters {
        border-radius: 25px;
        padding: 16px;
        display: grid;
        grid-template-columns: 2fr repeat(3, 1fr) auto auto;
        gap: 11px;
        margin-bottom: 20px;
      }
      .field {
        border: 1px solid rgba(159, 123, 131, 0.2);
        background: rgba(255, 254, 252, 0.76);
        padding: 12px 14px;
        border-radius: 16px;
        min-width: 0;
        width: 100%;
        outline: none;
      }
      .field:focus {
        border-color: rgba(179, 138, 91, 0.56);
        box-shadow:
          0 0 0 4px rgba(179, 138, 91, 0.08),
          inset 0 1px 0 #fff;
      }
      .count {
        color: var(--muted);
        font: italic 13px/1.6 Georgia, "Times New Roman", serif;
        letter-spacing: 0.045em;
        margin: 0 0 12px;
      }
      .content-tools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 14px;
      }
      .content-tools .count {
        margin: 0;
      }
      .content-tools .pill {
        min-width: 150px;
      }
      .library-pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
        margin: 28px auto 6px;
      }
      .library-pagination .page-gap {
        color: var(--light);
        padding: 0 2px;
      }
      .library-pagination .pill.current {
        color: #fff;
        background: linear-gradient(135deg, #c98696, #9e6574);
        border-color: transparent;
        pointer-events: none;
      }
      .batch-detail-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 9px;
        flex-wrap: wrap;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }
      .word-card {
        position: relative;
        border-radius: 26px;
        padding: 20px;
        transition: 0.35s;
        min-width: 0;
        border-color: rgba(210, 169, 179, 0.32);
        cursor: pointer;
      }
      .word-card .detail {
        cursor: text;
      }
      .word-card.favorite-card {
        background: linear-gradient(
          145deg,
          rgba(252, 248, 245, 0.98),
          rgba(239, 226, 227, 0.94)
        );
        border: 1.5px solid rgba(190, 98, 121, 0.72);
        box-shadow:
          0 20px 48px rgba(176, 83, 107, 0.29),
          inset 4px 0 0 rgba(194, 101, 124, 0.72),
          inset 0 0 0 1px rgba(255, 255, 255, 0.72);
      }
      .favorite-label {
        color: #985064;
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.08em;
        white-space: nowrap;
      }
      .word-card:hover {
        transform: translateY(-5px);
        background: var(--card-hover);
        border-color: rgba(179, 138, 91, 0.28);
        box-shadow:
          0 18px 36px rgba(56, 46, 49, 0.13),
          0 4px 14px rgba(179, 138, 91, 0.08);
      }
      .word-card.favorite-card:hover {
        background: linear-gradient(
          145deg,
          rgba(253, 248, 245, 1),
          rgba(236, 220, 222, 0.97)
        );
        border-color: rgba(177, 75, 101, 0.82);
        box-shadow:
          0 25px 55px rgba(168, 70, 96, 0.34),
          inset 4px 0 0 rgba(183, 78, 104, 0.82),
          inset 0 0 0 1px rgba(255, 255, 255, 0.78);
      }
      .word-card.favorite-card .word {
        color: #7d3f50;
      }
      .word-card.favorite-card .fav.on {
        position: relative;
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        margin: 0;
        padding: 0;
        border-radius: 50%;
        background: #bd6d82;
        color: #fff;
        font-size: 0;
        line-height: 1;
        text-align: center;
        transform: none;
        box-shadow: 0 6px 14px rgba(163, 72, 96, 0.28);
      }
      .word-card.favorite-card .fav.on svg {
        position: absolute;
        top: 50%;
        left: 50%;
        display: block;
        width: 18px;
        height: 18px;
        overflow: visible;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 30px;
        gap: 12px;
        color: var(--light);
        font-size: 12px;
      }
      .card-favorite-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        min-width: 0;
      }
      .fav {
        font-size: 20px;
        background: transparent;
        padding: 3px;
      }
      .fav.on {
        color: #c98294;
        transform: scale(1.08);
      }
      .word {
        font: 700 clamp(25px, 3vw, 35px) Georgia;
        margin: 9px 0 3px;
        overflow-wrap: anywhere;
      }
      .phonetic {
        color: var(--muted);
        font-family: Arial;
        margin-bottom: 12px;
      }
      .word-pos {
        display: inline-flex;
        align-self: center;
        margin: -3px auto 10px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(203, 189, 221, 0.34);
        color: #786d85;
        font:
          600 12px Arial,
          sans-serif;
        letter-spacing: 0.04em;
      }
      .meaning {
        line-height: 1.65;
        min-height: 50px;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin: 12px 0;
      }
      .tag {
        font-size: 12px;
        padding: 5px 9px;
        border-radius: 99px;
        background: #e8eef1;
      }
      .tag.status {
        background: var(--pink-soft);
      }
      .tag.pos {
        background: rgba(203, 189, 221, 0.38);
        color: #6f647d;
        font-family: Arial, sans-serif;
        font-weight: 600;
      }
      .detail {
        display: none;
        border-top: 1px dashed #e4ccd1;
        margin-top: 14px;
        padding-top: 14px;
      }
      .word-card.open .detail {
        display: block;
      }
      /* ===== 多词性例句、翻译遮罩与常见搭配 ===== */
      .example-list {
        display: grid;
        gap: 14px;
        width: 100%;
        text-align: left;
      }
      .example-item {
        padding: 14px;
        border: 1px solid rgba(211, 170, 180, 0.28);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.48);
      }
      .example-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 9px;
        color: var(--light);
        font: 10px Georgia, serif;
        letter-spacing: 0.1em;
      }
      .example-label-main {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        min-width: 0;
      }
      .example-sense {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        max-width: 100%;
        padding: 5px 9px;
        border: 1px solid rgba(201, 139, 154, 0.22);
        border-radius: 9px;
        color: #795c64;
        background: rgba(249, 232, 235, 0.72);
        font: 13px/1.35 "Noto Serif SC", "Microsoft YaHei", serif;
        letter-spacing: 0;
      }
      .example-sense b {
        flex: 0 0 auto;
        color: #aa6f7d;
        font-size: 11px;
        font-weight: 700;
      }
      .sentence {
        line-height: 1.65;
      }
      .sentence strong,
      .study-sentence strong {
        color: #984f63;
        font-weight: 800;
        background: linear-gradient(transparent 62%, rgba(231, 165, 178, 0.3) 0);
      }
      .translation {
        color: var(--muted);
        filter: blur(6px);
        opacity: 0.45;
        transition: 0.45s;
      }
      .translation.show {
        filter: none;
        opacity: 1;
      }
      .example-translation-actions {
        display: flex;
        justify-content: flex-end;
        margin: 9px 0 2px;
      }
      .example-translation-toggle {
        padding: 7px 11px;
        border: 1px solid rgba(201, 139, 154, 0.28);
        border-radius: 10px;
        background: rgba(249, 232, 235, 0.88);
        color: #8b5f69;
        font-size: 12px;
      }
      .example-translation-toggle:hover {
        border-color: rgba(185, 102, 123, 0.52);
        background: #f7dfe5;
      }
      .collocations {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
        gap: 8px;
        margin-top: 14px;
      }
      .collocations::before {
        content: "常见搭配";
        grid-column: 1 / -1;
        margin-bottom: 1px;
        color: #7e6b70;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      .collocation {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 3px;
        min-width: 0;
        padding: 9px 11px;
        border-radius: 12px;
        border: 1px solid rgba(155, 180, 190, 0.28);
        background: rgba(225, 235, 239, 0.96);
        color: #536870;
      }
      .collocation-phrase {
        overflow-wrap: anywhere;
        font: 600 13px/1.35 Georgia, serif;
      }
      .collocation-meaning {
        color: #718187;
        font: 12px/1.45 "Noto Serif SC", "Microsoft YaHei", serif;
      }
      .mini-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .mini-actions button {
        font-size: 12px;
        padding: 7px 9px;
        border-radius: 10px;
        background: rgba(244, 226, 230, 0.8);
      }
      .empty {
        text-align: center;
        padding: 70px 20px;
        border-radius: 28px;
        color: var(--muted);
        font:
          italic 15px/1.85 "Yu Mincho", "Hiragino Mincho ProN", Georgia,
          "Times New Roman", serif;
        letter-spacing: 0.035em;
      }
      /* ===== 沉浸学习与学习状态操作 ===== */
      .study-wrap {
        max-width: 900px;
        margin: auto;
      }
      .study-card {
        border-radius: 42px;
        padding: clamp(25px, 5vw, 52px);
        text-align: center;
        min-height: 480px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        border-color: rgba(156, 117, 126, 0.18);
        box-shadow:
          0 20px 48px rgba(56, 46, 49, 0.11),
          0 3px 8px rgba(56, 46, 49, 0.05),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }
      .study-card .example-list {
        margin: 24px 0 4px;
      }
      .study-card .example-item {
        background: rgba(255, 255, 255, 0.56);
      }
      .study-word {
        font: 700 clamp(44px, 8vw, 78px) Georgia;
        margin: 12px;
      }
      .study-meta {
        color: var(--muted);
      }
      .study-sentence {
        font: 20px Georgia;
        line-height: 1.7;
        margin: 25px 0 12px;
      }
      .study-controls {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      .shortcut {
        text-align: center;
        color: var(--light);
        font: italic 11px/1.6 Georgia, "Times New Roman", serif;
        letter-spacing: 0.055em;
        margin-top: 14px;
      }
      .collection-note,
      .result-note {
        color: #89767b;
        font: italic 14px/1.75 Georgia, "Times New Roman", serif;
        letter-spacing: 0.035em;
      }
      /* ===== 可组合筛选的记忆卡片 ===== */
      .memory-filters {
        grid-template-columns:
          minmax(190px, 1.55fr)
          repeat(4, minmax(130px, 1fr))
          auto;
      }
      .filter-summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 12px;
      }
      .filter-summary .count {
        margin: 0;
      }
      .flip-scene {
        width: min(740px, 100%);
        height: 420px;
        margin: 24px auto;
      }
      .flip-card {
        width: 100%;
        height: 100%;
        position: relative;
        cursor: pointer;
      }
      .face {
        position: absolute;
        inset: 0;
        border-radius: 40px;
        padding: 35px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition: box-shadow 0.18s ease;
      }
      .front,
      .flip-card.flipped .back {
        opacity: 1;
        pointer-events: auto;
      }
      .flip-card.flipped .front {
        opacity: 0;
        pointer-events: none;
      }
      .flip-card:not(.flipped):hover .front,
      .flip-card:focus-visible .front {
        box-shadow:
          0 25px 58px rgba(93, 61, 70, 0.14),
          inset 0 1px 0 rgba(255, 255, 255, 0.92);
      }
      .flip-card:focus-visible {
        outline: 2px solid rgba(181, 111, 130, 0.52);
        outline-offset: 7px;
        border-radius: 40px;
      }
      body.no-motion .face {
        transition-duration: 0.01ms;
      }
      .back {
        justify-content: flex-start;
        overflow-y: auto;
        scrollbar-width: thin;
      }
      .back .example-list {
        gap: 9px;
      }
      .back .example-item {
        padding: 10px 12px;
      }
      .back .translation {
        margin-bottom: 0;
      }
      .face .word {
        font-size: clamp(42px, 7vw, 70px);
      }
      /* ===== 记忆测试、答案反馈与题目导航 ===== */
      .quiz-card,
      .result-card {
        max-width: 920px;
        margin: auto;
        border-radius: 38px;
        padding: clamp(26px, 4.5vw, 52px);
        border-color: rgba(155, 116, 125, 0.18);
        box-shadow:
          0 20px 52px rgba(56, 46, 49, 0.11),
          0 3px 8px rgba(56, 46, 49, 0.05),
          inset 0 1px 0 rgba(255, 255, 255, 0.86);
      }
      .quiz-setup {
        max-width: 940px;
        margin: auto;
        border-radius: 32px;
        padding: clamp(24px, 5vw, 44px);
      }
      .quiz-page-intro {
        width: min(940px, 100%);
        margin: 0 auto;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 28px;
      }
      .quiz-page-intro h2 {
        margin: 5px 0 4px;
        font-size: clamp(32px, 4vw, 46px);
        line-height: 1.08;
      }
      .quiz-page-intro p {
        margin: 0;
        color: var(--muted);
        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
      }
      .quiz-intro-summary {
        width: min(390px, 100%);
        display: grid;
        grid-template-columns: repeat(3, minmax(92px, 1fr));
        gap: 10px;
      }
      .quiz-intro-stat {
        padding: 12px 14px;
        border: 1px solid rgba(159, 123, 131, 0.16);
        border-radius: 18px;
        background: rgba(255, 253, 251, 0.55);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
        text-align: center;
      }
      .quiz-intro-stat b {
        display: block;
        color: var(--rose-dark);
        font-family: var(--number-font);
        font-size: 23px;
        line-height: 1.1;
      }
      .quiz-intro-stat small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      .quiz-session-intro {
        max-width: 920px;
      }
      .quiz-session-intro .quiz-intro-stat b {
        overflow: hidden;
        font-family: inherit;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.55;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* 页头与设置面板作为一个整体居中，填补导航下方的无效留白。 */
      @media (min-width: 701px) {
        #quiz.page.active {
          display: flex;
          flex-direction: column;
          justify-content: flex-start;
          gap: 20px;
          min-height: calc(100vh - 170px);
          min-height: calc(100svh - 170px);
        }
        #quiz > .quiz-page-intro,
        #quiz > .quiz-setup,
        #quiz > .quiz-card,
        #quiz > .result-card {
          width: 100%;
        }
        #quiz > .quiz-setup {
          margin-block: 0;
        }
        #quiz > .quiz-session-intro + .quiz-card {
          margin-block: 0;
        }
      }
      .setup-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        margin: 22px 0;
      }
      .setup-grid label {
        color: var(--muted);
        font-size: 13px;
      }
      .setup-grid select {
        display: block;
        margin-top: 7px;
      }
      .quiz-filter-panel {
        margin: 4px 0 18px;
        padding: 16px;
        border: 1px solid rgba(207, 172, 180, 0.25);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.38);
      }
      .quiz-filter-panel h3 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      .quiz-filter-grid {
        display: grid;
        grid-template-columns: minmax(190px, 1.45fr) repeat(3, 1fr) auto;
        gap: 10px;
        align-items: center;
      }
      .quiz-top {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        font-size: 13px;
        color: var(--muted);
      }
      .quiz-top span {
        padding: 10px 8px;
        border: 1px solid rgba(159, 123, 131, 0.12);
        border-radius: 14px;
        background: rgba(255, 253, 251, 0.48);
        text-align: center;
      }
      .progress {
        height: 7px;
        border-radius: 99px;
        background: rgba(196, 171, 176, 0.24);
        margin: 15px 0 28px;
        overflow: hidden;
      }
      .progress i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #c47d8f, #b79bc4 58%, #b79365);
        transition: 0.4s;
      }
      .prompt {
        text-align: center;
        font-size: clamp(25px, 4vw, 38px);
        margin: 34px 0;
        line-height: 1.5;
      }
      .quiz-translation {
        margin: -14px auto 22px;
        padding: 11px 16px;
        border-radius: 14px;
        background: rgba(236, 231, 226, 0.82);
        color: var(--muted);
        text-align: center;
        line-height: 1.65;
      }
      .quiz-exit-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .quiz-exit-row .pill {
        min-width: 132px;
      }
      .quiz-toolbar-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        flex-wrap: wrap;
      }
      .quiz-cursor-toggle {
        min-width: 164px;
        height: 40px;
        padding-block: 5px;
      }
      .quiz-cursor-toggle .motion-bloom {
        font-family: Arial, sans-serif;
        font-size: 17px;
      }
      .quiz-cursor-toggle .motion-state {
        min-width: 24px;
      }
      .quiz-cursor-toggle:disabled {

        background: linear-gradient(125deg, #fff, #f2dde2 52%, #eee1d0);

      .quiz-prompt-word {

      .option-label {
        line-height: 1.5;

      .option-counterpart {

      /* 词集库在桌面端采用两层对称布局：首行筛选，次行放置两个等宽操作按钮。 */
      @media (min-width: 961px) {
        .filters:not(.memory-filters) {
          grid-template-columns: repeat(10, minmax(0, 1fr));
        }
        .filters:not(.memory-filters) > input,
        .filters:not(.memory-filters) > select {
          grid-column: span 2;
        }
        .filters:not(.memory-filters) > button {
          grid-column: span 5;
          min-height: 44px;
        }
      }
      /* ===== 响应式规则：平板与窄屏 ===== */
      @media (max-width: 960px) {
        .brand {
          display: none;
        }
        .topbar {
          justify-content: center;
        }
        .tools {
          margin-left: auto;
        }
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .filters {
          grid-template-columns: 1fr 1fr 1fr;
        }
        .memory-filters {
          grid-template-columns: repeat(3, 1fr);
        }
        .memory-filters input {
          grid-column: span 2;
        }
        .quiz-filter-grid {
          grid-template-columns: 1fr 1fr;
        }
        .quiz-filter-grid input {
          grid-column: span 2;
        }
        .filters input {
          grid-column: span 2;
        }
      }

          display: none;
        }
        .main {
          width: min(100% - 24px, 1160px);

          padding-bottom: 94px;
        }
        .sync-status {

        }
        .bottom-nav {

          right: 8px;
          bottom: 8px;

          padding: 8px 2px;

        }

        }

      .collection-stage {
        position: relative;
        min-height: 270px;
      }
      .collection-card {
        height: 100%;

      .collection-nav {
        position: absolute;

        align-items: center;
        gap: 7px;
        z-index: 2;

      .collection-arrow {
        width: 38px;
        height: 38px;

      .collection-arrow:hover {
        transform: translateY(-2px);
        background: #fff;
      }
      .collection-dots {
        display: flex;
        gap: 6px;
      }
      .collection-dot {
        width: 8px;
        height: 8px;
        border-radius: 99px;
        background: #e4cbd1;
        padding: 0;
        transition: 0.3s;
      }
      .collection-dot.active {

      @keyframes collectionIn {

          transform: translateX(12px);
        }
      }
      /* ===== 后续交互增强：学习切换、答案状态与集合导航 ===== */
      .study-toolbar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin: 0 auto 18px;
      }
      .study-toolbar label {
        color: var(--muted);
        font-size: 13px;
      }
      .study-toolbar .field {
        width: min(360px, 70vw);
      }
      .study-controls.navigation {
        display: grid;
        grid-template-columns: repeat(2, minmax(120px, 1fr));
        width: min(440px, 100%);
        margin: 22px auto 0;
      }
      .study-controls.status-actions {
        display: grid;
        grid-template-columns: repeat(4, minmax(105px, 1fr));
        width: min(650px, 100%);
        margin: 10px auto 0;
      }
      .study-controls button {
        width: 100%;
        min-height: 44px;
      }
      .home-grid ~ .actions .pill,
      .hero ~ .actions .pill {
        min-width: 150px;
      }
      .result-card .actions .pill {
        min-width: 132px;
      }
      .flash-manual {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(680px, 100%);
        margin: -8px auto 14px;
      }
      .flash-position {
        color: var(--muted);
        font-size: 13px;
      }
      .options button.selected-answer {
        border-color: #a66a7a;

        border-color: #9fb99b;

        box-shadow: 0 0 0 3px rgba(174, 204, 170, 0.2);

      .options button.wrong-answer {
        border-color: #d69aa8;

      .options button:disabled {
        opacity: 1;
      }
      .answer-mark {
        display: inline-block;
        margin-left: 7px;

          align-items: stretch;

        .study-toolbar .field {
          width: 100%;

        .study-controls.navigation {
          grid-template-columns: 1fr 1fr;

        .study-controls.status-actions {

        .study-controls button {

        .content-tools {
          align-items: stretch;
          flex-direction: column;

          width: 100%;

          display: grid;
          grid-template-columns: 1fr 1fr;
          width: 100%;

        .recent,

          0 0 8px rgba(255, 244, 238, 0.78),

        filter: blur(2px);

      /* 三层花瓣场：远景在页面后方，中景掠过庭院，前景从卡片上方经过。 */
      .petal-field {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        contain: layout paint;
      }
      .petal-field--back { z-index: 0; }
      .petal-field--mid { z-index: 0; }
      .petal-field--front { z-index: 12; }
      .petal-field .petal {
        position: absolute;
        top: -20vh;
        left: var(--petal-x, 50%);
        width: var(--petal-size, 18px);
        height: var(--petal-height, 26px);
        opacity: 0;
        animation-name: petalThroughLayers;
        animation-duration: var(--petal-duration, 18s);
        animation-delay: var(--petal-delay, 0s);
        animation-timing-function: linear;
        animation-iteration-count: infinite;
        transform-origin: 45% 38%;
        will-change: transform, opacity;
        filter: none;
      }
      .petal-field .petal::after {
        display: none;
        animation: none;
      }
      @keyframes petalThroughLayers {
        0% {
          opacity: 0;
          transform: translate3d(-2vw, -8vh, 0) rotate(-24deg) rotateY(0deg) scale(0.82);
        }
        7% { opacity: var(--petal-opacity, 0.5); }
        34% {
          opacity: var(--petal-opacity, 0.5);
          transform: translate3d(var(--petal-wind-a, 3vw), 43vh, 0) rotate(154deg) rotateY(118deg) scale(1);
        }
        66% {
          opacity: calc(var(--petal-opacity, 0.5) * 0.88);
          transform: translate3d(var(--petal-wind-b, -1vw), 83vh, 0) rotate(326deg) rotateX(154deg) scale(0.9);
        }
        91% { opacity: calc(var(--petal-opacity, 0.5) * 0.72); }
        100% {
          opacity: 0;
          transform: translate3d(var(--petal-wind-c, 5vw), 128vh, 0) rotate(510deg) rotateY(330deg) scale(0.76);
        }
      }
      body.page-hidden .petal-field .petal,
      body.page-hidden .petal-field .petal::after {
        animation-play-state: paused !important;
      }
      @media (prefers-reduced-motion: reduce) {
        .petal-field .petal {
          top: var(--petal-static-y, 20%);
          animation: none !important;
          opacity: 0.16;
          transform: rotate(18deg);
        }
      }
      @keyframes branchSway {
        from {
          transform: translate3d(0, -1px, 0) rotate(-0.55deg);
        }
        to {
          transform: translate3d(-7px, 5px, 0) rotate(0.8deg);
        }
      }

      /* ===== 克制的 React Bits 灵感动效：不引入框架，也不改变旧版信息架构 ===== */
      /* PillNav + GlassSurface 的原生实现：边缘清晰，文字层不参与模糊。 */
      .topbar {
        background:
          linear-gradient(112deg, rgba(255, 255, 255, 0.8), rgba(248, 241, 239, 0.68) 58%, rgba(245, 232, 232, 0.66)),
          rgba(255, 252, 249, 0.58);
        border-color: rgba(151, 112, 122, 0.2);
        backdrop-filter: blur(15px) saturate(116%);
        -webkit-backdrop-filter: blur(15px) saturate(116%);
        box-shadow:
          0 18px 42px rgba(63, 47, 52, 0.1),
          0 2px 6px rgba(63, 47, 52, 0.045),
          inset 0 1px 0 rgba(255, 255, 255, 0.96),
          inset 0 -1px 0 rgba(143, 100, 111, 0.07);
      }
      .nav button {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        border: 1px solid transparent;
        transition: color 0.28s ease, transform 0.28s ease, border-color 0.28s ease, box-shadow 0.28s ease;
      }
      .nav button::before {
        content: "";
        position: absolute;
        z-index: -1;
        inset: 4px;
        border-radius: 13px;
        background: linear-gradient(145deg, rgba(226, 187, 196, 0.56), rgba(245, 230, 224, 0.74));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.84), 0 7px 16px rgba(112, 72, 83, 0.08);
        opacity: 0;
        transform: translateY(72%) scaleX(0.7);
        transition: opacity 0.3s ease, transform 0.38s cubic-bezier(0.2, 0.76, 0.24, 1);
      }
      .nav button:hover::before,
      .nav button:focus-visible::before,
      .nav button.active::before {
        opacity: 1;
        transform: none;
      }
      .nav button.active {
        color: #704954;
        border-color: rgba(169, 100, 118, 0.12);
        background: transparent;
      }
      .nav button:active { transform: translateY(1px) scale(0.985); }
      .nav button:focus-visible {
        outline: 2px solid rgba(169, 100, 118, 0.58);
        outline-offset: 2px;
      }
      body.nav-intro .topbar {
        opacity: 0;
        transform: translate3d(-50%, -13px, 0) scale(0.985);
      }
      body.nav-intro-ready .topbar {
        opacity: 1;
        transform: translate3d(-50%, 0, 0) scale(1);
        transition: opacity 0.46s ease, transform 0.58s cubic-bezier(0.2, 0.74, 0.22, 1);
      }
      body.nav-intro .brand,
      body.nav-intro .nav button,
      body.nav-intro .tools { opacity: 0; transform: translateY(-7px); }
      body.nav-intro-ready .brand,
      body.nav-intro-ready .nav button,
      body.nav-intro-ready .tools {
        opacity: 1;
        transform: none;
        transition: opacity 0.38s ease, transform 0.45s cubic-bezier(0.2, 0.74, 0.22, 1);
      }
      body.nav-intro-ready .brand { transition-delay: 0.1s; }
      body.nav-intro-ready .nav button:nth-child(1) { transition-delay: 0.16s; }
      body.nav-intro-ready .nav button:nth-child(2) { transition-delay: 0.2s; }
      body.nav-intro-ready .nav button:nth-child(3) { transition-delay: 0.24s; }
      body.nav-intro-ready .nav button:nth-child(4) { transition-delay: 0.28s; }
      body.nav-intro-ready .nav button:nth-child(5) { transition-delay: 0.32s; }
      body.nav-intro-ready .nav button:nth-child(6) { transition-delay: 0.36s; }
      body.nav-intro-ready .tools { transition-delay: 0.4s; }

      /* 数据库首屏只展示稳定骨架，避免先渲染内置后备词库再切换真实数据。 */
      .home-boot-copy {
        margin: 10px 0 0;

        transform: translateX(-110%);

      @keyframes homeBootShimmer {

      }
      .home-boot-ring {

      /* 首页卡片保持静止，数字动画独立运行，避免首屏内容逐块弹入。 */
      #home .home-animated-card {
        opacity: 1;

        filter: none;

      #home .home-animated-card.is-revealed {
        opacity: 1;
        transform: none;

          opacity 0.62s ease var(--reveal-delay, 0ms),

      /* 词集库只保留短促的基础弹出，不叠加模糊、扫光或滚动触发效果。 */
      #library .word-card.library-card-enter {
        opacity: 1;
        transform: none;
        filter: none;
      }
      #library .word-card.library-card-enter.is-visible {
        opacity: 1;
        transform: none;
        filter: none;
      }
      /* 词集库一页包含较多卡片：静态半透明底色替代逐卡实时磨砂，屏幕外卡片
         交给浏览器跳过绘制；视觉层次保留，但滚动时不再反复重算背景模糊。 */
      #library .word-card {
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.94), rgba(246, 243, 239, 0.9)),
          var(--card-bg);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        content-visibility: auto;
        contain-intrinsic-size: auto 250px;
        transition:
          background-color 0.22s ease,
          border-color 0.22s ease,
          box-shadow 0.22s ease;
      }
      /* 性能背景规则写在收藏样式之后，需在词集库作用域内重新强调收藏层级。 */
      #library .word-card.favorite-card {
        background: linear-gradient(
          145deg,
          rgba(255, 244, 246, 0.99),
          rgba(232, 203, 210, 0.97)
        );
        border: 1.5px solid rgba(177, 75, 101, 0.84);
        box-shadow:
          0 18px 42px rgba(168, 70, 96, 0.3),
          inset 5px 0 0 rgba(183, 78, 104, 0.88),
          inset 0 0 0 1px rgba(255, 255, 255, 0.82);
      }
      #library .word-card.favorite-card:hover {
        background: linear-gradient(
          145deg,
          rgba(255, 240, 244, 1),
          rgba(225, 189, 199, 0.99)
        );
        border-color: rgba(159, 55, 82, 0.94);
        box-shadow:
          0 28px 60px rgba(135, 44, 70, 0.4),
          0 8px 22px rgba(183, 78, 104, 0.2),
          inset 5px 0 0 rgba(167, 60, 88, 0.94),
          inset 0 0 0 1px rgba(255, 255, 255, 0.86);
      }
      /* 词集库不靠位移制造悬浮感，以更清晰的双层阴影突出当前卡片。 */
      #library .word-card:hover {
        transform: none;
        border-color: rgba(159, 116, 82, 0.46);
        box-shadow:
          0 24px 52px rgba(54, 41, 45, 0.24),
          0 7px 20px rgba(162, 105, 81, 0.16),
          inset 0 0 0 1px rgba(255, 255, 255, 0.74);
      }
      #library .word-card.favorite-card:hover {
        border-color: rgba(159, 55, 82, 0.94);
        box-shadow:
          0 28px 60px rgba(135, 44, 70, 0.4),
          0 8px 22px rgba(183, 78, 104, 0.2),
          inset 5px 0 0 rgba(167, 60, 88, 0.94),
          inset 0 0 0 1px rgba(255, 255, 255, 0.86);
      }
      body.no-motion #home .home-animated-card,
      body.no-motion #library .word-card.library-card-enter,
      body.no-motion #library .word-card.library-card-enter.is-visible {
        opacity: 1;
        transform: none;
        filter: none;
        transition: none;
      }
      @media (max-width: 700px), (pointer: coarse) {
        .quiz-target-cursor { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #home .home-animated-card,
        #library .word-card.library-card-enter {
          opacity: 1;
          transform: none;
          filter: none;
          transition: none;
        }
        .quiz-target-cursor { display: none; }
      }

      /* GSAP 组件层：忠实保留 React Bits 的运动参数，页面仍沿用现有数据渲染。 */
      #topNav button::before { display: none; }
      #topNav button {
        position: relative;
        display: block;
        overflow: hidden;
        isolation: isolate;
      }
      #topNav .nav-hover-circle {
        position: absolute;
        z-index: 0;
        left: 50%;
        border-radius: 50%;
        background: linear-gradient(145deg, #b56f82, #d9a6b3 62%, #ead8cf);
        pointer-events: none;
        will-change: transform;
      }
      #topNav .nav-label-stack {
        position: absolute;
        z-index: 2;
        inset: 0;
        display: block;
        overflow: hidden;
        font-size: inherit;

        const stage = correct

        const correctStreak = correct ? current.correctStreak + 1 : 0;

          reviewStage: stage,
          correctStreak,
          lapseCount,
          lastReviewedAt: new Date(now).toISOString(),
          nextReviewAt: new Date(
            now + nextReviewDelay(intervalStage, correctStreak, lapseCount),
          ).toISOString(),
        };
        recordActivity("review", {

          collectionId: baseWord.collectionId,
          correct,
          source,

        const now = Date.now();

        if (status === "review") {

          updates.nextReviewAt = new Date(0).toISOString();

          updates.reviewStage = 0;
          updates.lastReviewedAt = null;
          updates.nextReviewAt = null;
          updates.correctStreak = 0;

        state.user.words[wordId] = {
          ...(state.user.words[wordId] || {}),

        const rect = ring.getBoundingClientRect();

        const dy = event.clientY - (rect.top + rect.height / 2);
        if (Math.hypot(dx, dy) < rect.width * 0.2) return;
        const angle = (Math.atan2(dy, dx) * 180) / Math.PI;

          End: 90,
        };
        if (!(event.key in keyValues)) return;
        setPomodoroDuration(keyValues[event.key]);
        event.preventDefault();
      });
      document.addEventListener("compositionstart", (e) => {
        if (liveSearchIds.has(e.target.id)) composingSearchId = e.target.id;
      });
      document.addEventListener("compositionend", (e) => {
        if (!liveSearchIds.has(e.target.id)) return;
        const id = e.target.id;
        const value = e.target.value;
        composingSearchId = "";
        applyLiveSearch(id, value, true);
      });
      // 搜索框使用 input 事件即时更新，其余选择器统一使用 change 事件。
      document.addEventListener("input", (e) => {
        if (e.target.id === "pomodoroDuration") {
          setPomodoroDuration(Number(e.target.value));
          return;
        }
        if (!liveSearchIds.has(e.target.id)) return;
        const composing =
          e.isComposing || composingSearchId === e.target.id;
        applyLiveSearch(e.target.id, e.target.value, !composing);
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "flashCollection") {
          state.flashCollectionFilter = e.target.value;
          state.flashSearchKeyword = "";
          state.flashCategoryFilter = "all";
          state.flashStatusFilter = "all";
          state.flashIndex = 0;
          state.flashFlipped = false;
          renderFlash();
        }
        if (e.target.id === "flashCategory") {
          state.flashCategoryFilter = e.target.value;
          state.flashIndex = 0;
          state.flashFlipped = false;
          renderFlash();
        }
        if (e.target.id === "flashStatus") {
          state.flashStatusFilter = e.target.value;
          state.flashIndex = 0;
          state.flashFlipped = false;
          renderFlash();
        }
        if (e.target.id === "flashSort") {
          state.flashSort = e.target.value;
          if (state.flashSort === "random")
            state.flashRandomSeed = Date.now() >>> 0;
          state.flashIndex = 0;
          state.flashFlipped = false;
          renderFlash();
        }
        if (e.target.id === "quizCollection") {
          state.quizSessionIds = null;
          state.quizCollectionFilter = e.target.value;
          state.quizSearchKeyword = "";
          state.quizCategoryFilter = "all";
          state.quizStatusFilter = "all";
          $("#quizSearch").value = "";
          $("#quizStatus").value = "all";
          $("#quizCategory").innerHTML = '<option value="all">全部分类</option>' + scopeCategories(state.quizCollectionFilter).map((category) => `<option value="${escapeHtml(category)}">${escapeHtml(category)}</option>`).join("");
          updateQuizHint();
        }
        if (e.target.id === "quizMode") updateQuizHint();
        if (e.target.id === "quizCategory") {
          state.quizSessionIds = null;
          state.quizCategoryFilter = e.target.value;
          updateQuizHint();
        }
        if (e.target.id === "quizStatus") {
          state.quizSessionIds = null;
          state.quizStatusFilter = e.target.value;
          updateQuizHint();
        }
        if (e.target.id === "studyCollection") {
          state.studySessionIds = null;
          state.studyCollectionFilter = e.target.value;
          const pool = studyPool();
          if (pool.length) setCurrentWordById(pool[0].id);
          renderStudy();
        }
        if (e.target.id === "collection") {
          state.collectionFilter = e.target.value;
          state.categoryFilter = "all";
          state.libraryPage = 0;
          renderLibrary();
        }
        if (e.target.id === "category") {
          state.categoryFilter = e.target.value;
          state.libraryPage = 0;
          renderLibrary();
        }
        if (e.target.id === "status") {
          state.statusFilter = e.target.value;
          state.libraryPage = 0;
          renderLibrary();
        }
        if (e.target.id === "sort") {
          state.sort = e.target.value;
          if (state.sort === "random")
            state.libraryRandomSeed = Date.now() >>> 0;
          state.libraryPage = 0;
          renderLibrary();
        }
      });
      // 键盘快捷键只在非输入控件中生效，避免干扰搜索与填空。
      document.addEventListener("keydown", (e) => {
        if (
          state.currentPage === "quiz" &&
          state.quiz &&
          !state.quiz.done &&
          !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)
        ) {
          const isPrevious =
            e.key === "ArrowLeft" || e.code === "Numpad4";
          const isNext =
            e.key === "ArrowRight" || e.code === "Numpad6";
          if (isPrevious || isNext) {
            e.preventDefault();
            if (isPrevious) moveQuizQuestion(-1);
            else nextQuestion();
            return;
          }
        }
        if (
          state.currentPage === "study" &&
          !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)
        ) {
          if (e.key === "ArrowLeft") moveStudy(-1);
          if (e.key === "ArrowRight") moveStudy(1);
          const currentWord = vocabularyData[state.currentWordIndex];
          if (e.key.toLowerCase() === "m")
            updateWordStatus(currentWord.id, "mastered");
          if (e.key.toLowerCase() === "r")
            updateWordStatus(currentWord.id, "review");
          if (e.key.toLowerCase() === "f")
            toggleFavorite(currentWord.id);
        }
        if (
          state.currentPage === "flash" &&
          !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)
        ) {
          if (
            (e.key === "Enter" || e.key === " ") &&
            e.target.matches?.("[data-flip]")
          ) {
            e.preventDefault();
            e.target.click();
            return;
          }
          if (e.key === "ArrowLeft") moveFlash(-1);
          if (e.key === "ArrowRight") moveFlash(1);
        }
        if (e.key === "Escape" && $("#modal").classList.contains("show")) {
          $("#modal [data-close]").click();
        }
        if (e.key === "Enter" && e.target.id === "blankAnswer")
          $("#submitBlank")?.click();
      });
      let scrollUiFrame = null;
      window.addEventListener(
        "scroll",
        () => {
          if (scrollUiFrame !== null) return;
          scrollUiFrame = requestAnimationFrame(() => {
            $("#toTop").classList.toggle("show", scrollY > 500);
            scrollUiFrame = null;
          });
        },
        { passive: true },
      );
      window.addEventListener("focus", () => {
        if (REMOTE_PROGRESS_SYNC_ENABLED && state.backendConnected)
          void pullBackendState({ force: true });
      });
      document.addEventListener("visibilitychange", () => {
        document.body.classList.toggle("page-hidden", document.hidden);
        if (
          REMOTE_PROGRESS_SYNC_ENABLED &&
          !document.hidden &&
          state.backendConnected
        )
          void pullBackendState({ force: true });
      });
      // 页面关闭前再写一次本地存储；公共站点不会上传个人学习进度。
      window.addEventListener("pagehide", () => {
        writeLocalUserData();
        if (
          REMOTE_PROGRESS_SYNC_ENABLED &&
          state.backendConnected &&
          backendSavePending
        ) {
          clearTimeout(backendSaveTimer);
          void flushBackendSave({ keepalive: true });
        }
      });
      // ===== 应用入口：HTTP 模式等待完整词库后再首次渲染真实首页 =====
      loadUserData();
      initQuizTargetCursor();
      const waitsForCatalogBootstrap =
        Boolean(document.getElementById("standaloneCatalog")) ||
        location.protocol !== "file:";
      if (waitsForCatalogBootstrap) renderBootingHome();
      else renderApp();
      prepareNavigationEntrance();
      ensureBeijingClock();
      void initializeBackend();
    </script>
    <script type="module" src="read-aloud.js"></script>
  </body>
</html>
